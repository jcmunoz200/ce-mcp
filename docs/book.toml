[book]
title = "ce-mcp"
authors = ["ce-mcp contributors"]
description = "Unofficial MCP server for Cheat Engine — design and migration documentation"
language = "en"
src = "."

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true

[output.html.playground]
editable = false
