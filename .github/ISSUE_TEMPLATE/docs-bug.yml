name: Documentation issue
description: Report a broken link, factual error or unclear documentation.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: File path or URL of the affected page.
      placeholder: docs/mcp/protocol.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or unclear?
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: If you have a source, link to it. Do not paste long excerpts.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain a security vulnerability (use SECURITY.md for those).
          required: true
